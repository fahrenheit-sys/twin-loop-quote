<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twin Loop Quote Tool</title>
<style>
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    .no-print { display: none !important; }
  }
  #quote-app-root * { box-sizing: border-box; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="quote-app-root" style="max-width:850px;margin:20px auto;border:1px solid #ddd;border-radius:12px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden;background:#fff;color:#000;box-shadow:0 4px 12px rgba(0,0,0,.1);">

  <div id="app-header" style="background:#f8f9fa;padding:15px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;">
    <img id="header-logo" src="https://www.twinloop.com.au/wp-content/uploads/2021/06/twinloop-header-logo-blueonwhite-@2x.png" style="height:36px;" alt="Twin Loop">
    <button id="back-btn" style="display:none;background:#000;border:none;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">&larr; Back</button>
  </div>

  <div id="chat-window" style="min-height:80px;padding:25px;display:flex;flex-direction:column;justify-content:center;text-align:center;">
    <div id="active-question-container" style="font-size:18px;font-weight:500;">Loading pricing data&hellip;</div>
  </div>

  <div id="input-area" style="padding:20px;border-top:1px solid #eee;background:#fdfdfd;min-height:150px;">

    <div id="button-space" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;"></div>

    <div id="text-input-space" style="display:none;flex-direction:column;gap:12px;max-width:400px;margin:0 auto;">
      <input type="text" id="text-input-field" placeholder="" style="padding:12px;border:1px solid #000;border-radius:4px;font-size:16px;font-family:inherit;">
      <div style="display:flex;gap:8px;">
        <button id="submit-text" style="flex:1;padding:12px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-family:inherit;">Continue &rarr;</button>
        <button id="skip-text" style="padding:12px 16px;background:#fff;color:#000;border:1px solid #000;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;">Skip</button>
      </div>
    </div>

    <div id="multi-qty-space" style="display:none;flex-direction:column;gap:15px;max-width:400px;margin:0 auto;">
      <p style="font-size:13px;color:#666;margin:0;text-align:center;">Enter up to 4 quantities (separated by commas):</p>
      <input type="text" id="manual-qtys" placeholder="e.g. 100, 500, 1000, 5000" style="padding:12px;border:1px solid #000;border-radius:4px;font-size:16px;text-align:center;font-family:inherit;">
      <button id="submit-qtys" style="padding:12px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-family:inherit;">Confirm Quantities &rarr;</button>
    </div>

    <div id="cover-dashboard" style="display:none;flex-direction:column;gap:20px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
        <div style="padding:15px;border:1px solid #ddd;border-radius:8px;background:#fff;">
          <h4 style="margin:0 0 10px;">Front Cover</h4>
          <select id="f-type" style="width:100%;padding:8px;margin-bottom:10px;font-family:inherit;" onchange="updateCoverUI()"></select>
          <div id="f-src-wrap">
            <label style="font-size:11px;font-weight:bold;">Supplier:</label>
            <select id="f-source" style="width:100%;padding:8px;margin-bottom:10px;font-family:inherit;" onchange="updateCoverUI()">
              <option value="Twin Loop">Twin Loop</option>
              <option value="Client Supplied">Client Supplied</option>
            </select>
          </div>
          <div id="f-coll-wrap" style="display:none;">
            <label style="font-size:11px;font-weight:bold;">Collated?</label>
            <select id="f-collated" style="width:100%;padding:8px;font-family:inherit;">
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
        <div style="padding:15px;border:1px solid #ddd;border-radius:8px;background:#fff;">
          <h4 style="margin:0 0 10px;">Back Cover</h4>
          <select id="b-type" style="width:100%;padding:8px;margin-bottom:10px;font-family:inherit;" onchange="updateCoverUI()"></select>
          <div id="b-src-wrap">
            <label style="font-size:11px;font-weight:bold;">Supplier:</label>
            <select id="b-source" style="width:100%;padding:8px;margin-bottom:10px;font-family:inherit;" onchange="updateCoverUI()">
              <option value="Twin Loop">Twin Loop</option>
              <option value="Client Supplied">Client Supplied</option>
            </select>
          </div>
          <div id="b-coll-wrap" style="display:none;">
            <label style="font-size:11px;font-weight:bold;">Collated?</label>
            <select id="b-collated" style="width:100%;padding:8px;font-family:inherit;">
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
      </div>
      <button id="submit-covers" style="padding:15px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-family:inherit;">Continue &rarr;</button>
    </div>

    <div id="number-space" style="display:none;flex-direction:column;gap:10px;max-width:400px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="label-1" style="font-size:14px;min-width:100px;font-weight:bold;">Value:</span>
        <input type="number" id="manual-number" style="flex:1;padding:10px;border:1px solid #000;border-radius:4px;font-size:16px;font-family:inherit;" min="0">
      </div>
      <button id="submit-number" style="padding:10px 25px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-family:inherit;">Continue &rarr;</button>
    </div>

  </div>
</div>

<div id="contact-modal" class="no-print" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;max-width:440px;width:100%;border-radius:12px;padding:28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
    <div id="contact-modal-msg" style="font-size:15px;line-height:1.6;color:#000;margin-bottom:22px;"></div>
    <button id="contact-modal-ok" style="padding:10px 26px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-family:inherit;">Got it</button>
  </div>
</div>

<script>
const SB_URL  = 'https://bqfoguehtdkzvmwloehh.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZm9ndWVodGRrenZtd2xvZWhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDM3NDMsImV4cCI6MjA5NTg3OTc0M30.G-XeeOmZAREGBvDPqlWz17xxRQIgn7JsQVGNMCX9QNk';

let db    = {};
let state = {};

function generateQuoteNumber() {
  const today  = new Date().toISOString().slice(0, 10);
  const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
  const num    = Math.floor(Math.random() * 900) + 100;
  return today + '-' + letter + num;
}

function initDefaults() {
  state = {
    step: 0, qtys: [], leafSize: '', leafCount: 0, leafMM: 0, leafGSMValue: 0,
    frontCoverName: 'None', frontCoverMM: 0, frontCoverCost: 0, frontSource: 'Twin Loop', frontCollated: 'Yes',
    backCoverName:  'None', backCoverMM:  0, backCoverCost:  0, backSource:  'Twin Loop', backCollated:  'Yes',
    celloType: 'No', celloCost: 0, celloSetup: 0,
    collating: {},
    selectedExtras: [], bindCategory: '', bindSubtype: '', history: [],
    customerName: '', customerCompany: '', customerEmail: '', customerReference: '',
    quoteNumber: generateQuoteNumber()
  };
}

// ── Step definitions ──────────────────────────────────────────────────────────
// Customer capture is AFTER extras — they are emotionally invested by then.
const steps = [
  { id: 'bindCategory',    q: 'What type of binding do you need?',       type: 'button',    source: 'bindCategory' },
  { id: 'bindSubtype',     q: 'Select style:',                            type: 'button',    source: 'bindSubtype' },
  { id: 'qtys',            q: 'How many copies do you need?',             type: 'multi-qty' },
  { id: 'leafSize',        q: 'What is your document size?',              type: 'button',    source: 'leafSizes' },
  { id: 'leafCount',       q: 'How many internal sheets per book?',       type: 'number' },
  { id: 'gsm',             q: 'What paper weight (GSM)?',                 type: 'button',    source: 'gsm' },
  { id: 'coverDashboard',  q: 'Select your covers:',                      type: 'cover-dash', condition: () => !isPerfect() && !isCase() },
  { id: 'celloType',       q: 'Apply glazing or lamination to covers?',   type: 'button',    source: 'celloTypes', condition: () => isPerfect() || isCase() },
  { id: 'extras',          q: 'Any production extras? (select all that apply)', type: 'multiselect' },
  { id: 'customerReference', q: 'Estimate Request Number (optional):', type: 'text-input', placeholder: 'e.g. 12345', required: false },
  { id: 'customerName',    q: "Almost done! What's your name?",           type: 'text-input', placeholder: 'e.g. John Smith',     required: true  },
  { id: 'customerCompany', q: 'Company name (optional):',                 type: 'text-input', placeholder: 'e.g. Acme Corp',      required: false },
  { id: 'customerEmail',   q: 'Your email address (to receive the quote):', type: 'text-input', placeholder: 'e.g. john@acme.com', required: true  },
  { id: 'calculate',       q: 'Generating your quote…',              type: 'result' }
];

function isPerfect() { return state.bindCategory === 'Prefect Binding'; }
function isCase()    { return state.bindCategory === 'Case Binding';    }

// ── Contact popup (non-standard items are quoted manually) ─────────────────────
const CONTACT_EMAIL = 'quotes@twinloop.com.au';
const CASE_EXTRA_MSG = `Contact Twin Loop on <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a> and provide details such as the size of foiling or debossing required.`;
function showContactPopup(msg) {
  document.getElementById('contact-modal-msg').innerHTML = msg;
  document.getElementById('contact-modal').style.display = 'flex';
}

// Binding setup fee (per quantity).
function bindSetupFee(q) {
  if (isPerfect()) {
    if (state.bindSubtype === 'Regular (EVA) Glue') return 45;
    if (state.bindSubtype === 'Robust (PUR) Glue') {
      if (q < 50)  return 50;
      if (q < 75)  return 75;
      if (q < 100) return 100;
      if (q < 150) return 150;
      return 200;
    }
    return 0;
  }
  if (isCase()) return 50;
  if (['Wire Binding', 'Plastic Spiral', 'Comb'].includes(state.bindCategory)) return 45;
  return 0;
}

// ── Cover dashboard UI ────────────────────────────────────────────────────────
function updateCoverUI() {
  const ft = document.getElementById('f-type').value;
  const bt = document.getElementById('b-type').value;
  document.getElementById('f-src-wrap').style.display  = ft !== 'None' ? 'block' : 'none';
  document.getElementById('b-src-wrap').style.display  = bt !== 'None' ? 'block' : 'none';
  document.getElementById('f-coll-wrap').style.display = (document.getElementById('f-source').value === 'Client Supplied' && ft !== 'None') ? 'block' : 'none';
  document.getElementById('b-coll-wrap').style.display = (document.getElementById('b-source').value === 'Client Supplied' && bt !== 'None') ? 'block' : 'none';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  if (state.step >= steps.length) return;
  const current = steps[state.step];

  // Auto-skip bindSubtype when only option is "-" (e.g. Comb, Plastic Spiral, Case)
  if (current.id === 'bindSubtype') {
    const styles = Object.keys(db['binding-costs'][state.bindCategory] || {});
    if (styles.length === 1 && styles[0] === '-') {
      state.bindSubtype = '-';
      state.step++;
      return render();
    }
  }
  if (current.condition && !current.condition()) {
    state.step++;
    return render();
  }

  document.getElementById('active-question-container').innerText = current.q;
  const bSpace = document.getElementById('button-space');
  const nSpace = document.getElementById('number-space');
  const mSpace = document.getElementById('multi-qty-space');
  const dSpace = document.getElementById('cover-dashboard');
  const tSpace = document.getElementById('text-input-space');
  [bSpace, nSpace, mSpace, dSpace, tSpace].forEach(s => s.style.display = 'none');
  document.getElementById('back-btn').style.display = state.history.length > 0 ? 'block' : 'none';

  if (current.type === 'text-input') {
    tSpace.style.display = 'flex';
    const field = document.getElementById('text-input-field');
    field.value       = state[current.id] || '';
    field.placeholder = current.placeholder || '';
    field.focus();
    document.getElementById('skip-text').style.display = current.required ? 'none' : 'block';

  } else if (current.type === 'button') {
    bSpace.innerHTML = '';
    bSpace.style.display = 'flex';
    getOptions(current).forEach(opt => bSpace.appendChild(createBtn(opt.label, () => handleInput(opt.val))));

  } else if (current.type === 'multi-qty') {
    mSpace.style.display = 'flex';

  } else if (current.type === 'cover-dash') {
    dSpace.style.display = 'flex';
    ['f-type', 'b-type'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      sel.add(new Option('None', 'None'));
      Object.keys(db.covers).forEach(k => sel.add(new Option(k, k)));
    });
    updateCoverUI();

  } else if (current.type === 'multiselect') {
    bSpace.innerHTML = '';
    bSpace.style.display = 'flex';
    const extras = db.extras.filter(e => {
      if (e.exclude && e.exclude.some(cat => state.bindCategory === cat)) return false;
      if (e.only   && e.only.length > 0 && !e.only.some(cat => state.bindCategory === cat)) return false;
      return true;
    });
    extras.push({ name: 'Collating' });
    const CASE_CONTACT_EXTRAS = ['Ribbons', 'Foiling', 'DeBossing'];
    extras.forEach(item => {
      const isSel = state.selectedExtras.some(e => e.name === item.name);
      const btn = createBtn(item.name, () => {
        if (isSel) {
          state.selectedExtras = state.selectedExtras.filter(e => e.name !== item.name);
        } else if (isCase() && CASE_CONTACT_EXTRAS.includes(item.name)) {
          // Ribbons, Foiling, DeBossing for Case Binding must be quoted manually — do not add to selection.
          showContactPopup(CASE_EXTRA_MSG);
          return;
        } else {
          state.selectedExtras.push(item);
        }
        render();
      });
      if (isSel) { btn.style.background = '#000'; btn.style.color = '#fff'; }
      bSpace.appendChild(btn);
    });

    // Collating sub-options (inserts are a subset of collating).
    const collOn = state.selectedExtras.some(e => e.name === 'Collating');
    if (collOn) {
      const panel = document.createElement('div');
      panel.style.cssText = 'flex-basis:100%;width:100%;margin-top:8px;padding:14px;border:1px dashed #999;border-radius:8px;display:flex;flex-direction:column;gap:8px;text-align:left;';
      const h = document.createElement('div');
      h.innerText = 'Collating options (select all that apply):';
      h.style.cssText = 'font-weight:bold;font-size:13px;margin-bottom:2px;';
      panel.appendChild(h);
      const collatingOpts = (db['collating-options'] || []).filter(opt => (isCase() || isPerfect()) ? opt.key === 'text' : true);
      collatingOpts.forEach(opt => {
        const cur = state.collating[opt.key];
        const on  = opt.needsQty ? (parseFloat(cur || 0) > 0) : !!cur;
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:10px;';
        const tbtn = createBtn((on ? '☑ ' : '☐ ') + opt.label, () => {
          if (opt.needsQty) state.collating[opt.key] = on ? 0 : (parseFloat(cur) || 1);
          else              state.collating[opt.key] = !on;
          render();
        });
        tbtn.style.flex = '1'; tbtn.style.textAlign = 'left';
        if (on) { tbtn.style.background = '#000'; tbtn.style.color = '#fff'; }
        row.appendChild(tbtn);
        if (opt.needsQty && on) {
          const qin = document.createElement('input');
          qin.type = 'number'; qin.min = '1'; qin.value = parseFloat(cur) || 1;
          qin.style.cssText = 'width:80px;padding:8px;border:1px solid #000;border-radius:4px;font-family:inherit;';
          qin.onchange = () => { state.collating[opt.key] = parseFloat(qin.value) || 0; };
          const lbl = document.createElement('span'); lbl.innerText = 'per book'; lbl.style.fontSize = '11px';
          row.appendChild(qin); row.appendChild(lbl);
        }
        panel.appendChild(row);
      });
      bSpace.appendChild(panel);
    }

    bSpace.appendChild(createBtn('Continue →', () => { state.history.push(state.step); state.step++; render(); }, '200px'));

  } else if (current.type === 'number') {
    nSpace.style.display = 'flex';
    document.getElementById('label-1').innerText = current.id === 'leafCount' ? 'Sheets:' : 'Quantity:';

  } else if (current.type === 'result') {
    setTimeout(runCalculations, 50);
  }
}

// ── Options builder ───────────────────────────────────────────────────────────
function getOptions(current) {
  if (current.source === 'bindCategory') {
    return Object.keys(db['binding-costs']).map(k => ({ label: k, val: k }));
  }
  if (current.source === 'bindSubtype') {
    return Object.keys(db['binding-costs'][state.bindCategory] || {}).map(k => ({ label: k, val: k }));
  }
  if (current.source === 'leafSizes') {
    const sub = (db['binding-costs'][state.bindCategory] || {})[state.bindSubtype] || {};
    return Object.keys(sub).map(s => ({ label: s, val: s }));
  }
  if (current.source === 'gsm') {
    return db.gsm.map(i => ({ label: i.GSM + ' gsm', val: i }));
  }
  if (current.source === 'celloTypes') {
    // Perfect binding: double-sided gloss/matt/soft touch is not offered.
    const glazing = (db['cello-glazing'] || []).filter(c => !(isPerfect() && /double sided/i.test(c.label)));
    return [
      { label: 'No Celloglazing', val: { label: 'No Celloglazing', cost: 0, setup: 0 } },
      { label: 'Supplied Celloed', val: { label: 'Supplied Celloed', cost: 0, setup: 0 } },
      ...glazing.map(c => ({ label: c.label, val: c }))
    ];
  }
  return (current.options || []).map(o => ({ label: o, val: o }));
}

// ── Button factory ────────────────────────────────────────────────────────────
function createBtn(txt, fn, width) {
  const b = document.createElement('button');
  b.innerText = txt;
  b.style.cssText = `padding:10px 14px;border:1px solid #000;background:#fff;color:#000;cursor:pointer;border-radius:4px;font-weight:bold;font-family:inherit;width:${width || 'auto'};margin-bottom:4px;`;
  b.onclick = fn;
  return b;
}

// ── Input handlers ────────────────────────────────────────────────────────────
function handleInput(val) {
  state.history.push(state.step);
  const id = steps[state.step].id;
  if (id === 'gsm') {
    state.leafGSMValue = parseFloat(val.GSM);
    state.leafMM       = parseFloat(val.MM);
  } else if (id === 'celloType') {
    state.celloType  = val.label;
    state.celloCost  = parseFloat(val.cost  || 0);
    state.celloSetup = parseFloat(val.setup || 0);
  } else {
    state[id] = val;
  }
  state.step++;
  render();
}

function submitTextInput(skip) {
  const current = steps[state.step];
  const val = skip ? '' : document.getElementById('text-input-field').value.trim();
  if (current.required && !val) {
    document.getElementById('text-input-field').style.border = '2px solid red';
    return;
  }
  document.getElementById('text-input-field').style.border = '1px solid #000';
  state.history.push(state.step);
  state[current.id] = val;
  state.step++;
  render();
}

document.getElementById('contact-modal-ok').onclick = () => { document.getElementById('contact-modal').style.display = 'none'; };
document.getElementById('submit-text').onclick  = () => submitTextInput(false);
document.getElementById('skip-text').onclick    = () => submitTextInput(true);
document.getElementById('text-input-field').addEventListener('keydown', e => { if (e.key === 'Enter') submitTextInput(false); });

document.getElementById('submit-qtys').onclick = () => {
  const qtys = document.getElementById('manual-qtys').value
    .split(/[\s,]+/).map(v => parseInt(v)).filter(v => v > 0).slice(0, 4);
  if (qtys.length > 0) { state.qtys = qtys; state.history.push(state.step); state.step++; render(); }
};

document.getElementById('submit-number').onclick = () => {
  const v = document.getElementById('manual-number').value;
  if (v !== '') { handleInput(parseFloat(v)); document.getElementById('manual-number').value = ''; }
};

document.getElementById('submit-covers').onclick = () => {
  const fK = document.getElementById('f-type').value;
  const bK = document.getElementById('b-type').value;
  state.frontCoverName  = fK;
  state.backCoverName   = bK;
  state.frontCoverCost  = fK !== 'None' ? parseFloat(db.covers[fK]?.[state.leafSize] || 0) : 0;
  state.backCoverCost   = bK !== 'None' ? parseFloat(db.covers[bK]?.[state.leafSize] || 0) : 0;
  state.frontCoverMM    = fK !== 'None' ? parseFloat(db.covers[fK]?.mm || 0)               : 0;
  state.backCoverMM     = bK !== 'None' ? parseFloat(db.covers[bK]?.mm || 0)               : 0;
  state.frontSource     = document.getElementById('f-source').value;
  state.frontCollated   = document.getElementById('f-collated').value;
  state.backSource      = document.getElementById('b-source').value;
  state.backCollated    = document.getElementById('b-collated').value;
  state.history.push(state.step);
  state.step++;
  render();
};

document.getElementById('back-btn').onclick = () => {
  if (state.history.length > 0) { state.step = state.history.pop(); render(); }
};

// ── Calculations & result screen ──────────────────────────────────────────────
function fmtDate(d) {
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function runCalculations() {
  const fmt       = v => new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
  const leafCount = parseFloat(state.leafCount || 0);
  const spineMM   = (leafCount * state.leafMM) + state.frontCoverMM + state.backCoverMM;

  // Thickness bracket lookup — every binding type is priced by spine-thickness bracket.
  const impRow = db.imperial.find(r => spineMM <= r.Max) || db.imperial[db.imperial.length - 1];
  let wireSize = impRow.Wire;
  // The "Wire:" bracket is only shown to the customer for actual wire-type bindings, not perfect/case.
  const showWire = !(isPerfect() || isCase());

  // Binding unit cost — nested as leaf size > thickness bracket for all categories.
  // The database (Binding Costs table) is the source of truth for the max size we can bind:
  // if there's no price for this category/leaf size at this thickness bracket, the job is
  // beyond our maximum — fall back to pricing at the largest bracket the database does have,
  // and flag it so the quote clearly discloses that the job exceeds our max size.
  let bindUnit  = 0;
  let maxSpineMM = null;
  try {
    const costTable = db['binding-costs'][state.bindCategory][state.bindSubtype][state.leafSize];
    if (typeof costTable === 'number') {
      bindUnit = costTable;
    } else if (costTable) {
      bindUnit = parseFloat(costTable[wireSize] || 0);
      if (!bindUnit) {
        for (let i = db.imperial.length - 1; i >= 0; i--) {
          const row      = db.imperial[i];
          const fallback = parseFloat(costTable[row.Wire] || 0);
          if (fallback) { bindUnit = fallback; wireSize = row.Wire; maxSpineMM = row.Max; break; }
        }
      }
    }
  } catch (e) { bindUnit = 0; }
  const oversized = maxSpineMM !== null;
  // Plastic Spiral: wire-size bracket is a pricing lookup, not a real "wire" — keep it out of the
  // customer-facing description line, it still appears under Technical Details below.
  const showWireInDesc = showWire && state.bindCategory !== 'Plastic Spiral';

  // Surcharges
  const fSurcharge = (state.frontCoverName !== 'None' && state.frontSource === 'Client Supplied' && state.frontCollated === 'No') ? 0.10 : 0;
  const bSurcharge = (state.backCoverName  !== 'None' && state.backSource  === 'Client Supplied' && state.backCollated  === 'No') ? 0.10 : 0;

  // Binding label with full context
  const bindLabel = [
    state.bindCategory,
    (state.bindSubtype && state.bindSubtype !== '-') ? state.bindSubtype : null,
    state.leafSize,
    leafCount + ' leaves',
    showWireInDesc ? 'Wire: ' + wireSize : null
  ].filter(Boolean).join(' — ');

  let items = [
    { label: bindLabel,                                                                                           unit: bindUnit,                                                                  active: true },
    { label: 'Front Cover: ' + state.frontCoverName + ' (' + state.frontSource + ')',                            unit: (state.frontSource === 'Twin Loop' ? state.frontCoverCost : 0) + fSurcharge, active: state.frontCoverName !== 'None' },
    { label: 'Back Cover: '  + state.backCoverName  + ' (' + state.backSource  + ')',                            unit: (state.backSource  === 'Twin Loop' ? state.backCoverCost  : 0) + bSurcharge, active: state.backCoverName  !== 'None' },
    { label: 'Glazing: ' + state.celloType,                                                                      unit: state.celloCost,                                                           active: state.celloCost > 0 }
  ];

  state.selectedExtras.forEach(e => {
    if (e.name !== 'Collating') {
      const cost = db.extras.find(x => x.name === e.name)?.cost || 0;
      if (cost) items.push({ label: e.name, unit: cost, active: true });
    }
  });

  const activeItems   = items.filter(i => i.active);
  const celloSetupFee = state.celloSetup   || 0;
  const bindSetups    = state.qtys.map(q => bindSetupFee(q));

  // Collating lines — one per selected collating option, each with a per-qty cost array.
  const collatingOn   = state.selectedExtras.some(e => e.name === 'Collating');
  const collatingLines = [];
  if (collatingOn) {
    (db['collating-options'] || []).forEach(opt => {
      const sel    = state.collating[opt.key];
      const qty    = opt.needsQty ? parseFloat(sel || 0) : 0;
      const active = opt.needsQty ? qty > 0 : !!sel;
      if (!active) return;
      const costs = state.qtys.map(q => {
        if (opt.unit === 'per_1000_sheets')   return Math.max(opt.min || 0, (q * leafCount / 1000) * opt.cost);
        if (opt.unit === 'per_book')          return opt.cost * q;
        if (opt.unit === 'per_unit_per_book') return opt.cost * qty * q;
        return 0;
      });
      collatingLines.push({ label: opt.needsQty ? `${opt.label} (${qty}/book)` : opt.label, costs });
    });
  }

  // Per-qty totals
  let bindMin = 100; // PUR Perfect Binding minimum
  if ((isPerfect() && state.bindSubtype === 'Regular (EVA) Glue') ||
      ['Wire Binding', 'Plastic Spiral', 'Comb'].includes(state.bindCategory)) {
    bindMin = 95;
  } else if (isCase()) {
    bindMin = 125;
  }
  const minCharge = bindMin + (celloSetupFee > 0 ? 50 : 0);

  const totals = state.qtys.map((q, idx) => {
    const discKey     = state.bindCategory === 'Case Binding' ? 'Case Binding' : isPerfect() ? 'Prefect Binding' : 'general';
    const discTable   = db['volume-discount'][discKey] || db['volume-discount']['general'] || [];
    const disc        = discTable.find(t => q >= t.Start && q <= t.End) || discTable[discTable.length - 1] || { Rate: 0 };
    const perUnitSum  = activeItems.reduce((s, i) => s + i.unit, 0);
    const collCost    = collatingLines.reduce((s, l) => s + l.costs[idx], 0);
    const subtotal    = (perUnitSum * q) + collCost + celloSetupFee + bindSetups[idx];
    const discRate    = disc.Rate;
    const discAmt     = subtotal * (discRate / 100);
    const preMin      = subtotal - discAmt;
    const afterDisc   = Math.max(minCharge, preMin);
    const minApplied  = preMin < minCharge;
    const minUplift   = minApplied ? afterDisc - preMin : 0;
    const gst         = afterDisc * 0.10;
    return { qty: q, discountPct: discRate, discountAmt: discAmt, afterDisc, minApplied, minUplift, gst, totalIncGST: afterDisc + gst };
  });

  // Stash for sendQuote()
  window._quoteComputed = { spineMM, wireSize: showWire ? wireSize : null, oversized, maxSpineMM, items: activeItems, totals, collatingLines, celloSetupFee, bindSetups };

  const today = new Date();
  const valid = new Date(); valid.setDate(today.getDate() + 30);

  // Hide the top header logo — the quote body already has the logo
  document.getElementById('header-logo').style.display = 'none';

  // ── Spine breakdown helper ─────────────────────────────────────────────────
  const leafStackMM = (leafCount * state.leafMM).toFixed(2);
  const techRows = [
    `<tr><td style="padding:3px 8px;color:#666;">Internal leaves:</td><td style="padding:3px 8px;">${leafCount} &times; ${state.leafMM}mm&nbsp;(${state.leafGSMValue}gsm) = <b>${leafStackMM}mm</b></td></tr>`,
    state.frontCoverName !== 'None' ? `<tr><td style="padding:3px 8px;color:#666;">Front cover (${state.frontCoverName}):</td><td style="padding:3px 8px;"><b>${state.frontCoverMM}mm</b></td></tr>` : '',
    state.backCoverName  !== 'None' ? `<tr><td style="padding:3px 8px;color:#666;">Back cover (${state.backCoverName}):</td><td style="padding:3px 8px;"><b>${state.backCoverMM}mm</b></td></tr>`   : '',
    `<tr style="border-top:1px solid #ccc;"><td style="padding:5px 8px;font-weight:bold;color:#333;">This estimate is based on a thickness of:</td><td style="padding:5px 8px;font-weight:bold;">${spineMM.toFixed(2)}mm${showWire ? ' (Wire size: <b>' + wireSize + '</b>)' : ''}</td></tr>`,
    oversized ? `<tr><td colspan="2" style="padding:8px;background:#fff3cd;border:1px solid #f0ad4e;color:#8a6d3b;font-weight:bold;">&#9888; Maximum size exceeded: based on the information provided, this job's spine (${spineMM.toFixed(2)}mm) is over the maximum thickness of ${maxSpineMM}mm we can bind for ${state.bindCategory}. This estimate has been calculated at our maximum size — please contact us to confirm before proceeding.</td></tr>` : ''
  ].join('');

  // ── Pricing table rows ─────────────────────────────────────────────────────
  const itemRows = activeItems.map(i => `
    <tr style="border-bottom:1px solid #f0f0f0;">
      <td style="padding:6px 8px;">${i.label}</td>
      ${state.qtys.map(q => `<td style="text-align:right;padding:6px 8px;">$${fmt(i.unit * q)}</td>`).join('')}
    </tr>`).join('');

  const collRow = collatingLines.map(l => `
    <tr style="border-bottom:1px solid #f0f0f0;">
      <td style="padding:6px 8px;">${l.label}</td>
      ${l.costs.map(c => `<td style="text-align:right;padding:6px 8px;">$${fmt(c)}</td>`).join('')}
    </tr>`).join('');

  const setupRow = celloSetupFee > 0 ? `
    <tr style="border-bottom:1px solid #f0f0f0;">
      <td style="padding:6px 8px;">Glazing Setup Fee</td>
      ${state.qtys.map(() => `<td style="text-align:right;padding:6px 8px;">$${fmt(celloSetupFee)}</td>`).join('')}
    </tr>` : '';

  const bindSetupRow = bindSetups.some(f => f > 0) ? `
    <tr style="border-bottom:1px solid #f0f0f0;">
      <td style="padding:6px 8px;">Binding Setup Fee</td>
      ${bindSetups.map(f => `<td style="text-align:right;padding:6px 8px;">$${fmt(f)}</td>`).join('')}
    </tr>` : '';

  const discountRow = `
    <tr style="font-weight:bold;color:#c0392b;border-top:1px solid #ddd;">
      <td style="padding:6px 8px;">Volume Discount</td>
      ${totals.map(t => `<td style="text-align:right;padding:6px 8px;">-${t.discountPct}%&nbsp;(-$${fmt(t.discountAmt)})</td>`).join('')}
    </tr>`;

  const minChargeRow = totals.some(t => t.minApplied) ? `
    <tr style="font-style:italic;color:#777;border-top:1px solid #eee;">
      <td style="padding:6px 8px;">Minimum charge applied</td>
      ${totals.map(t => `<td style="text-align:right;padding:6px 8px;">${t.minApplied ? '+$' + fmt(t.minUplift) : '—'}</td>`).join('')}
    </tr>` : '';

  const subtotalRow = `
    <tr style="border-top:2px solid #000;">
      <td style="padding:8px;font-weight:bold;">Subtotal (ex GST)</td>
      ${totals.map(t => `<td style="text-align:right;padding:8px;font-weight:bold;">$${fmt(t.afterDisc)}</td>`).join('')}
    </tr>
    <tr>
      <td style="padding:4px 8px;color:#555;">GST (10%)</td>
      ${totals.map(t => `<td style="text-align:right;padding:4px 8px;color:#555;">$${fmt(t.gst)}</td>`).join('')}
    </tr>`;

  const totalRow = `
    <tr style="font-weight:bold;font-size:14px;background:#000;color:#fff;">
      <td style="padding:12px;">TOTAL (INC GST)</td>
      ${totals.map(t => `<td style="text-align:right;padding:12px;font-size:15px;">$${fmt(t.totalIncGST)}</td>`).join('')}
    </tr>`;

  const html = `
  <div id="print-area" style="text-align:left;font-size:11px;">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #000;">
      <img src="/logo.png" style="height:45px;" alt="Twin Loop">
      <div style="text-align:right;line-height:1.7;">
        <div style="font-size:20px;font-weight:bold;letter-spacing:2px;">QUOTE</div>
        <div><b>Quote #:</b> ${state.quoteNumber}</div>
        ${state.customerReference ? `<div><b>Estimate Request #:</b> ${state.customerReference}</div>` : ''}
        <div><b>Date:</b> ${fmtDate(today)}</div>
        <div><b>Valid Until:</b> ${fmtDate(valid)}</div>
      </div>
    </div>

    <div style="margin-bottom:20px;padding:12px;background:#f8f9fa;border-radius:6px;line-height:1.9;">
      <b>Prepared for:</b><br>
      ${state.customerName    ? state.customerName    + '<br>' : ''}
      ${state.customerCompany ? state.customerCompany + '<br>' : ''}
      ${state.customerEmail   ? '<a href="mailto:' + state.customerEmail + '" style="color:#000;">' + state.customerEmail + '</a>' : ''}
    </div>

    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
      <tr style="background:#f2f2f2;font-weight:bold;border-bottom:2px solid #000;">
        <td style="padding:8px;">Description</td>
        ${state.qtys.map(q => `<td style="text-align:right;padding:8px;">Qty&nbsp;${q}</td>`).join('')}
      </tr>
      ${itemRows}
      ${collRow}
      ${setupRow}
      ${bindSetupRow}
      ${discountRow}
      ${minChargeRow}
      ${subtotalRow}
      ${totalRow}
    </table>
    </div>

    <div style="background:#f4f4f4;border:1px solid #ccc;padding:12px;border-radius:6px;margin-bottom:20px;font-size:11px;">
      <b>Technical Details</b>
      <table style="width:100%;border-collapse:collapse;margin-top:8px;">
        ${techRows}
      </table>
    </div>

    <div style="margin-bottom:20px;padding:12px 14px;border-top:1px solid #ddd;font-size:11px;color:#555;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;">
      <div><b>Twin Loop Binding</b><br>15 Hugh Street Belmore, NSW 2192</div>
      <div>&#128222; <a href="tel:1300657850" style="color:#000;">1300 657 850</a><br>&#9993; <a href="mailto:quotes@twinloop.com.au" style="color:#000;">quotes@twinloop.com.au</a></div>
      <div style="color:#888;">ABN 78 082 258 035</div>
    </div>

    <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;">
      <button id="email-btn" onclick="sendQuote()" style="flex:1;min-width:170px;padding:14px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;font-family:inherit;">
        &#9993;&nbsp; Email Me This Quote
      </button>
      <button onclick="window.print()" style="flex:1;min-width:130px;padding:14px;background:#fff;color:#000;border:2px solid #000;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;font-family:inherit;">
        &#128438;&nbsp; Download PDF
      </button>
      <button onclick="location.reload()" style="flex:1;min-width:130px;padding:14px;background:#fff;color:#000;border:2px solid #000;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;font-family:inherit;">
        &#8635;&nbsp; New Quote
      </button>
    </div>

  </div>`;

  document.getElementById('active-question-container').innerHTML = html;
  document.getElementById('input-area').style.display = 'none';
}

// ── Send quote to API ─────────────────────────────────────────────────────────
async function sendQuote() {
  const btn = document.getElementById('email-btn');
  if (!btn || btn.disabled) return;

  if (!state.customerEmail) {
    alert('No email address on file. Please start a new quote and enter your email.');
    return;
  }

  btn.textContent = 'Generating PDF…';
  btn.disabled = true;

  // Generate PDF from the rendered quote panel
  let quotePdfBase64 = null;
  try {
    const printArea = document.getElementById('print-area');

    // Clone into a fixed-width off-screen container for consistent layout
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;background:#fff;';
    const clone = printArea.cloneNode(true);
    clone.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');
    clone.querySelectorAll('[style*="overflow-x"]').forEach(el => el.style.overflowX = 'visible');
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);
    await new Promise(r => setTimeout(r, 150));

    const canvas = await html2canvas(clone, { scale: 2, useCORS: true, logging: false, width: 800, windowWidth: 800 });
    document.body.removeChild(wrapper);

    const imgData  = canvas.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const pdf      = new jsPDF('p', 'mm', 'a4');
    const pageW    = pdf.internal.pageSize.getWidth();
    const pageH    = pdf.internal.pageSize.getHeight();
    const margin   = 10; // mm each side
    const contentW = pageW - margin * 2;
    const imgH     = canvas.height * (contentW / canvas.width);

    pdf.addImage(imgData, 'JPEG', margin, margin, contentW, imgH);
    let shown = pageH - margin;
    while (shown < imgH) {
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', margin, margin - shown, contentW, imgH);
      shown += pageH;
    }
    quotePdfBase64 = pdf.output('datauristring').split(',')[1];
  } catch (e) {
    console.warn('PDF generation failed, sending without attachment:', e);
  }

  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/api/send-quote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state, computed: window._quoteComputed, quotePdfBase64 })
    });
    const data = await res.json();
    if (data.success) {
      btn.textContent = '✓ Sent to ' + state.customerEmail;
      btn.style.background = '#2e7d32';
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch (e) {
    btn.textContent = '✗ Error — try again';
    btn.style.background = '#c0392b';
    btn.disabled = false;
  }
}

// ── Load pricing from Supabase then start wizard ──────────────────────────────
async function loadPricing() {
  const h   = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON };
  const get = t => fetch(SB_URL + '/rest/v1/' + t + '?select=*', { headers: h }).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + t);
    return r.json();
  });

  try {
    const [gsmRows, impRows, discRows, celloRows, coverRows, extraRows, bindRows, collRows, collCoverRows, insertRows] = await Promise.all([
      get('gsm'), get('imperial'), get('volume_discount'), get('cello_glazing'),
      get('covers'), get('extras'), get('binding_costs'), get('collating_general'),
      get('collating_covers'), get('inserts')
    ]);

    // GSM
    db.gsm = gsmRows.map(r => ({ GSM: r.gsm, MM: parseFloat(r.mm) }));

    // Imperial wire size table
    db.imperial = impRows
      .sort((a, b) => parseFloat(a.min_mm) - parseFloat(b.min_mm))
      .map(r => ({ Min: parseFloat(r.min_mm), Max: parseFloat(r.max_mm), Wire: r.wire }));

    // Volume discount — grouped by binding_type; rate stored as decimal (0.05), converted to % (5)
    db['volume-discount'] = {};
    discRows.forEach(r => {
      const type = r.binding_type || 'general';
      if (!db['volume-discount'][type]) db['volume-discount'][type] = [];
      db['volume-discount'][type].push({ Start: r.start_qty, End: r.end_qty, Rate: parseFloat(r.rate) * 100 });
    });
    Object.values(db['volume-discount']).forEach(arr => arr.sort((a, b) => a.Start - b.Start));

    // Cello glazing options
    db['cello-glazing'] = celloRows.map(r => ({
      label: r.label,
      cost:  parseFloat(r.cost),
      setup: parseFloat(r.setup_fee || 0)
    }));

    // Cover types  { "PVC": { "A4": 0.20, mm: 0.6 }, ... }
    db.covers = {};
    coverRows.forEach(r => {
      if (!db.covers[r.name]) db.covers[r.name] = {};
      db.covers[r.name][r.leaf_size] = parseFloat(r.cost);
      db.covers[r.name].mm           = parseFloat(r.mm);
    });

    // Extras list
    db.extras = extraRows.map(r => ({
      name:    r.name,
      cost:    parseFloat(r.cost),
      exclude: r.exclude_bindings || [],
      only:    r.only_bindings    || []
    }));

    // Collating general rate (text collating)
    db.collating = collRows[0]
      ? { rate: parseFloat(collRows[0].rate_per_1000), min: parseFloat(collRows[0].min_charge) }
      : { rate: 10, min: 50 };

    // Collating options — built from existing tables: collating_covers (per book),
    // collating_general (text, per 1,000 sheets), inserts (tabs/sheets, per unit per book).
    const coverRate = type => parseFloat((collCoverRows.find(r => r.type === type) || {}).rate || 0);
    const insertCost = type => parseFloat((insertRows.find(r => r.type === type) || {}).cost || 0);
    db['collating-options'] = [
      { key: 'front_covers',          label: 'Collate front covers',        unit: 'per_book',          cost: coverRate('Front Cover'),    min: 0,            needsQty: false },
      { key: 'back_covers',           label: 'Collate back covers',         unit: 'per_book',          cost: coverRate('Back Cover'),     min: 0,            needsQty: false },
      { key: 'front_and_back_covers', label: 'Collate front & back covers', unit: 'per_book',          cost: coverRate('Front and Back'), min: 0,            needsQty: false },
      { key: 'text',                  label: 'Collate text',                unit: 'per_1000_sheets',   cost: db.collating.rate,           min: db.collating.min, needsQty: false },
      { key: 'tabs',                  label: 'Insert tabs',                 unit: 'per_unit_per_book', cost: insertCost('Per Tab'),       min: 0,            needsQty: true  },
      { key: 'sheets',                label: 'Insert sheets',               unit: 'per_unit_per_book', cost: insertCost('Per Sheet'),     min: 0,            needsQty: true  }
    ];

    // Binding costs — nested: category > subtype > leaf_size [> wire_size] = cost
    db['binding-costs'] = {};
    bindRows.forEach(r => {
      if (!db['binding-costs'][r.category])           db['binding-costs'][r.category]           = {};
      if (!db['binding-costs'][r.category][r.subtype]) db['binding-costs'][r.category][r.subtype] = {};

      const noWire = !r.wire_size || r.wire_size === '-' || r.wire_size === 'N/A';
      if (noWire) {
        // Perfect Binding, Case Binding — no wire size
        db['binding-costs'][r.category][r.subtype][r.leaf_size] = parseFloat(r.cost);
      } else {
        // Wire Binding, Comb, Spiral — nested by wire size
        if (!db['binding-costs'][r.category][r.subtype][r.leaf_size]) {
          db['binding-costs'][r.category][r.subtype][r.leaf_size] = {};
        }
        db['binding-costs'][r.category][r.subtype][r.leaf_size][r.wire_size] = parseFloat(r.cost);
      }
    });

    initDefaults();
    render();

  } catch (e) {
    console.error('Pricing load failed:', e);
    document.getElementById('active-question-container').innerHTML =
      '<span style="color:#c0392b;font-size:14px;">&#9888; Failed to load pricing data. Please refresh the page.</span>';
  }
}

loadPricing();
</script>
